# Checks a pull request that touches the shared directory: every entry is
# well formed and opens, and the pull request changes nothing but directory/
# (a listing can never slip code into the engine everyone's site runs).
name: Directory
on:
  pull_request:
    paths: ['directory/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only directory files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          others=$(git diff --name-only "$BASE" HEAD | grep -v '^directory/' || true)
          if [ -n "$others" ]; then
            echo "::error::A pull request that changes directory/ may change nothing else. Also changed:"
            echo "$others"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Every entry is well formed; the changed ones open
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node tools/directory.mjs check
          git diff --name-only -z --diff-filter=AM "$BASE" HEAD -- 'directory/*.json' | xargs -0 -r node tools/directory.mjs check --online --portal
