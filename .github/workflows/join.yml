# Turns a "Request listing" issue into a pull request that adds one file to
# directory/. Runs only in the main repository (repository variable
# HOMECRAFT_DIRECTORY = true); nothing reaches the directory until the
# maintainer merges it. Issue text is only ever handled as data.
name: Join
on:
  issues:
    types: [opened, edited, labeled, reopened]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  # Ignored third-party/bot comments must not cancel an active inspection.
  group: >-
    join-${{ github.event.issue.number }}-${{
    (github.event_name != 'issue_comment' ||
    (github.event.comment.user.type != 'Bot' &&
    (github.event.comment.user.login == github.event.issue.user.login ||
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))))
    && 'request' || github.run_id }}
  cancel-in-progress: true
jobs:
  inspect:
    if: >-
      vars.HOMECRAFT_DIRECTORY == 'true' && !github.event.issue.pull_request && github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'join') &&
      (github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' &&
      (github.event.comment.user.login == github.event.issue.user.login ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report: ${{ steps.inspect.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Read metadata and exercise the public portal
        id: inspect
        run: node tools/check-listing.mjs --issue "$GITHUB_EVENT_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-${{ github.event.issue.number }}
          path: tools/.check/listing/
          retention-days: 7
  propose:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.inspect.outputs.report }}
        with:
          script: |
            const fs = require('node:fs');
            const { problems, slugFor, keyOf } = await import(`${process.env.GITHUB_WORKSPACE}/tools/directory.mjs`);
            const { owner, repo } = context.repo, issue = context.payload.issue;
            const base = context.payload.repository.default_branch;
            const current = (await github.rest.issues.get({ owner, repo, issue_number: issue.number })).data;
            if (current.state !== 'open' || current.body !== issue.body || !current.labels.some(l => l.name === 'join')) return;

            // One reply on the issue, updated rather than repeated.
            const MARK = '<!-- homecraft-join -->';
            async function say(text) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number });
              const mine = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(MARK));
              const body = `${MARK}\n${text}`;
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            }

            const { entry, issues, review } = JSON.parse(process.env.REPORT);
            const errors = [...new Set([...issues, ...problems(entry)])];
            if (errors.length || review.length) {
              await say(['自动检查结果 / Automated checks', '', ...errors.map(i => `- ${i}`), ...review.map(i => `- ${i}`), '',
                '请处理提示后编辑此 Issue，或部署后在此回复以自动复查，无需重新申请。',
                'Edit this issue or reply after redeploying to rerun checks; no new application is needed.'].join('\n'));
              core.setFailed(errors.length ? 'Listing checks failed; see the issue reply.' : 'Maintainer review needed; see the issue reply.');
              return;
            }

            // The same world again updates its file; another world gets a new one.
            const dir = `${process.env.GITHUB_WORKSPACE}/directory/`;
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json') && !f.startsWith('_'));
            const same = files.find(f => { try { return keyOf(JSON.parse(fs.readFileSync(dir + f, 'utf8')).url) === keyOf(entry.url); } catch { return false; } });
            if (same) entry.added = JSON.parse(fs.readFileSync(dir + same, 'utf8')).added || entry.added;
            let slug = same ? same.slice(0, -5) : slugFor(entry.url);
            for (let n = 2; !same && files.includes(`${slug}.json`); n++) slug = `${slugFor(entry.url).slice(0, 36)}-${n}`;

            const branch = `join/${issue.number}`, path = `directory/${slug}.json`;
            const head = (await github.rest.repos.getBranch({ owner, repo, branch: base })).data.commit.sha;
            try { await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: head }); }
            catch { await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: head, force: true }); }
            let sha;
            try { sha = (await github.rest.repos.getContent({ owner, repo, path, ref: branch })).data.sha; } catch {}
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch, sha,
              message: `${same ? 'Update' : 'Add'} ${slug} in the directory (#${issue.number})`,
              content: Buffer.from(JSON.stringify(entry, null, 2) + '\n').toString('base64'),
            });

            const body = [
              `Closes #${issue.number}`, '',
              '```json', JSON.stringify(entry, null, 2), '```', '',
              'Public-directory discovery, cross-site navigation, return and character transfer passed on desktop (Chinese) and mobile (English).',
              'Before merging, review the website content. Automated portal checks do not assess content compliance.',
            ].join('\n');
            const open = (await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' })).data;
            const pr = open[0] ? (await github.rest.pulls.update({ owner, repo, pull_number: open[0].number, body })).data
              : (await github.rest.pulls.create({ owner, repo, head: branch, base, title: `申请收录 / Request listing: ${slug}`, body })).data;
            await say(`已生成 #${pr.number}，等待维护者审核。合并后，网站将随下一次目录发布显示在传送门中。\n#${pr.number} is ready for review. Once merged, the website will appear in portals after the next directory publication.`);
