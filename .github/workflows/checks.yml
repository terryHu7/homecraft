name: Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@v9
        id: source
        with:
          result-encoding: string
          script: |
            const { resolveCheckBase } = await import(`${process.env.GITHUB_WORKSPACE}/tools/pr-check.mjs`);
            return await resolveCheckBase({ github, context });
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tools/pr-check.mjs
        env:
          PR_BASE: ${{ steps.source.outputs.result }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checks-${{ github.run_id }}
          path: tools/.check/
          retention-days: 7
