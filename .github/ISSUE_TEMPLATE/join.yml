name: Request listing / 申请收录
description: Request a listing in the Homecraft public directory. 申请将网站收录到 Homecraft 公共目录。
title: "Request listing / 申请收录: "
labels: [join]
body:
  - type: markdown
    attributes:
      value: |
        Submitted information is public. Keep a working portal connected to the shared directory. Existing websites can install the portal plugin: https://github.com/terryHu7/homecraft/tree/main/plugin

        提交的资料会公开。请保留连接公共目录的传送门。已有网站可以安装传送门插件：https://github.com/terryHu7/homecraft/tree/main/plugin
  - type: input
    id: url
    attributes:
      label: Address / 网址
      description: A public HTTPS URL. 可公开访问的 HTTPS 网址。
      placeholder: https://alex.github.io/home/
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Website name / 网站名称
      description: Up to 60 characters. 60 字以内。
      placeholder: Alex's Home
    validations:
      required: true
  - type: input
    id: name_en
    attributes:
      label: English name (optional) / 英文名称（可选）
      description: Fill in only if different from the name above. 与上方名称不同时填写。
  - type: input
    id: owner
    attributes:
      label: Author name / 作者名称
      description: Up to 40 characters. 40 字以内。
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Languages / 网站语言
      options:
        - Chinese and English / 中文和英文
        - Chinese / 中文
        - English / 英文
    validations:
      required: true
  - type: input
    id: intro
    attributes:
      label: Introduction / 简介
      description: Up to 120 characters. Leave blank only if homecraft.json provides intro. 120 字以内；homecraft.json 已提供 intro 时可留空。
  - type: input
    id: intro_en
    attributes:
      label: English introduction (optional) / 英文简介（可选）
  - type: input
    id: logo
    attributes:
      label: Logo
      description: A square image on the same website, up to 100 KB. Leave blank only if homecraft.json provides logo. 同一网站下的方形图片，不超过 100 KB；homecraft.json 已提供 logo 时可留空。
      placeholder: https://alex.github.io/home/assets/logo.png
  - type: input
    id: preview
    attributes:
      label: Preview image (optional) / 预览图（可选）
      description: An image on the same website, such as og.jpg. 同一网站下的图片，例如 og.jpg。
      placeholder: https://alex.github.io/home/assets/og.jpg
